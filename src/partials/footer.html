<footer class="border-t border-white/10 bg-night-800">
  <div class="wrap grid gap-10 py-12 md:grid-cols-3">
    <div>
      <img src="{{ROOT}}assets/logo.svg" alt="PuraSport — Hidrata · Rinde · Gana" class="h-16 w-auto">
      <p class="mt-4 text-sm text-white/60">Liga PuraSport · baloncesto formativo para niñas y niños de 6 a 13 años.</p>
    </div>
    <div class="text-sm">
      <p class="font-bold uppercase tracking-[.16em] text-white/50">Contacto</p>
      <ul class="mt-2 text-white/80">
        <li><a class="inline-block py-2.5 hover:text-brand" href="https://wa.me/{{whatsappNumber}}" data-track="wa_footer">WhatsApp {{whatsappDisplay}}</a></li>
        <li><a class="inline-block py-2.5 hover:text-brand" href="{{mapsUrl}}" rel="noopener" target="_blank">{{sede}}</a></li>
      </ul>
    </div>
    <div class="text-sm">
      <p class="font-bold uppercase tracking-[.16em] text-white/50">Síguenos</p>
      <ul class="mt-2 text-white/80">
        <li><a class="inline-block py-2.5 hover:text-brand" href="{{instagram}}" rel="noopener" target="_blank">Instagram {{handle}}</a></li>
        <li><a class="inline-block py-2.5 hover:text-brand" href="{{facebook}}" rel="noopener" target="_blank">Facebook {{handle}}</a></li>
      </ul>
    </div>
  </div>
  <div class="border-t border-white/10">
    <div class="wrap flex flex-col gap-2 py-6 text-xs text-white/45 sm:flex-row sm:justify-between">
      <p>Organiza {{organizador}} · Marca PuraSport</p>
      <p><a href="{{ROOT}}privacidad/" class="inline-block py-2 underline hover:text-white">Privacidad y uso de datos</a></p>
    </div>
  </div>
</footer>
<!--@include cookie-->
<script src="{{ROOT}}assets/js/site.js" defer></script>
